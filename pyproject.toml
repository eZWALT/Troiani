[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "troiani"
version = "0.1.0"
description = "Troiani: The Openest sub-billion LLM Model Family Built From Scratch (Mamba 3)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
  { name = "eZWALT" },
]

dependencies = [
  "torch",
  "transformers",
  "causal-conv1d>=1.2.0",
  "tilelang==0.1.8",
  "apache-tvm-ffi<=0.1.9",
  "quack-kernels>=0.3.4",
  "triton>=3.5.0",
  "ninja",
  "einops",
  "packaging",
  "tokenizers>=0.15.0",
  "datasets>=2.14.0",
  "sentencepiece>=0.1.99",
  "numpy>=1.24.0",
  "tqdm>=4.65.0",
  "wandb>=0.15.0",
  "setuptools>=61.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "ruff>=0.1.0",
  "mypy>=1.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: marks tests that require CUDA (deselect with '-m \"not cuda\"')",
]
